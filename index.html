<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Press</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #111;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    #btn {
        width: 120px;
        height: 120px;
        background-color: red;
        border-radius: 50%;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
    }

    #rickroll {
        display: none;
        width: 100%;
        height: 100vh;
        object-fit: cover;
    }
</style>
</head>
<body>

<button id="btn">PRESS</button>

<img id="rickroll" src="https://media.giphy.com/media/Ju7l5y9osyymQ/giphy.gif" />

<script>
    const btn = document.getElementById("btn");
    const rickroll = document.getElementById("rickroll");

    btn.onclick = function() {
        btn.style.display = "none";
        rickroll.style.display = "block";
    }
</script>

</body>
</html>
